<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="_uAYFuA-3T0i19IF6PNXau841TDdLlyrMPJpIvQ4wYU" />
    <title>Offline - CrownCode</title>
    <style>
        @font-face {
            font-family: 'IM Fell Double Pica';
            src: url('/fonts/im-fell-double-pica-regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Portmanteau';
            src: url('/fonts/portmanteau-regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --color-primary: #e7c77a;
            --color-secondary: #a4743a;
            --color-accent: #eac06f;
            --color-background: #0b0a08;
            --color-surface: #15110e;
            --color-surface-elevated: #1f1914;
            --color-border: #2c231b;
            --color-text-primary: #f4ede3;
            --color-text-secondary: #c8b9a7;
            --color-text-muted: #9a8d7d;
            --color-success: #7fb069;
            --color-error: #a64b3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IM Fell Double Pica', 'Times New Roman', serif;
            background:
                radial-gradient(120% 120% at 20% 0%, rgba(231, 199, 122, 0.18) 0%, transparent 55%),
                linear-gradient(135deg, #0b0a08 0%, #15110e 55%, #0b0a08 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-primary);
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            background: rgba(231, 199, 122, 0.15);
            border: 1px solid rgba(201, 147, 71, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        h1 {
            font-family: 'Portmanteau', 'IM Fell Double Pica', serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }

        .retry-btn {
            background: rgba(231, 199, 122, 0.2);
            color: var(--color-text-primary);
            border: 2px solid rgba(201, 147, 71, 0.4);
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .retry-btn:hover {
            background: rgba(231, 199, 122, 0.28);
            border-color: rgba(201, 147, 71, 0.6);
            transform: translateY(-2px);
        }

        .features {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
        }

        .feature {
            background: rgba(21, 17, 14, 0.6);
            border: 1px solid rgba(231, 199, 122, 0.12);
            padding: 1rem;
            border-radius: 12px;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
        }

        .feature-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .feature-text {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .icon {
            animation: pulse 2s infinite;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">
            📡
        </div>

        <h1>Çevrimdışısınız</h1>

        <p>
            İnternet bağlantınız yok gibi görünüyor. CrownCode Platformu'nun bazı özelliklerini çevrimdışı olarak
            kullanabilirsiniz.
        </p>

        <button class="retry-btn" onclick="retryConnection()">
            🔄 Tekrar Dene
        </button>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">💾</div>
                <div class="feature-text">Önbellek</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📖</div>
                <div class="feature-text">Dokümantasyon</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">Hızlı Yükleme</div>
            </div>
        </div>
    </div>

    <script>
        function retryConnection() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                // Show a message that we're still offline
                const btn = document.querySelector('.retry-btn');
                const originalText = btn.textContent;
                btn.textContent = '❌ Hala Çevrimdışı';
                btn.style.background = 'rgba(166, 75, 60, 0.35)';

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = 'rgba(231, 199, 122, 0.2)';
                }, 2000);
            }
        }

        // Auto-retry when online
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Update UI based on connection status
        function updateConnectionStatus() {
            if (navigator.onLine) {
                document.querySelector('.retry-btn').style.background = 'rgba(127, 176, 105, 0.35)';
                document.querySelector('.retry-btn').textContent = '✅ Tekrar Dene';
            }
        }

        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        // Initial check
        updateConnectionStatus();
    </script>
</body>

</html>
