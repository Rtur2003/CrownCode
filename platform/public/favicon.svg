<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="crownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C77A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="120" height="120" rx="24" fill="#0B0A08" />
  
  <g transform="translate(15, 25)" filter="url(#glow)">
    <!-- Minimalist Crown -->
    <path d="M 15 65 L 15 25 L 35 45 L 45 15 L 55 45 L 75 25 L 75 65 Z" 
          stroke="url(#crownGradient)" 
          stroke-width="6" 
          stroke-linejoin="round"
          fill="none" />
    
    <!-- Code Bracket Underneath -->
    <path d="M 25 80 L 45 80" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" />
    <path d="M 65 80 L 75 80" 
          stroke="#E7C77A" 
          stroke-width="6" 
          stroke-linecap="round" />
  </g>
</svg>