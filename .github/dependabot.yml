version: 2
updates:
  # Platform dependencies (Next.js frontend)
  - package-ecosystem: "npm"
    directory: "/platform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    target-branch: "geliştirme"
    labels:
      - "dependencies"
      - "platform"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    assignees:
      - "Rtur2003"
    reviewers:
      - "Rtur2003"

  # NOTE: hf-crowncode-backend/ is a separate repo (.gitignore line 120).
  # Its Python dependencies are managed in that repo's own CI.

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
    open-pull-requests-limit: 5
    target-branch: "geliştirme"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
      - "automated"
    commit-message:
      prefix: "chore(deps-actions):"
    assignees:
      - "Rtur2003"
