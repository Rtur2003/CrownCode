version: 2
updates:
  # Platform dependencies (Next.js frontend)
  - package-ecosystem: "npm"
    directory: "/platform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    target-branch: "geliştirme"
    labels:
      - "dependencies"
      - "platform"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    assignees:
      - "Rtur2003"
    reviewers:
      - "Rtur2003"

  # HF backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/hf-crowncode-backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    target-branch: "geliştirme"
    labels:
      - "dependencies"
      - "python"
      - "hf-backend"
      - "automated"
    commit-message:
      prefix: "chore(deps-py):"
      include: "scope"
    assignees:
      - "Rtur2003"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
    open-pull-requests-limit: 5
    target-branch: "geliştirme"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
      - "automated"
    commit-message:
      prefix: "chore(deps-actions):"
    assignees:
      - "Rtur2003"
