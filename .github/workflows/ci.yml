name: CI/CD Pipeline

on:
  push:
    branches: [master, geliştirme]
  pull_request:
    branches: [master, geliştirme]

jobs:
  # Type checking and linting
  quality-check:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: ./platform
        run: npm ci

      - name: TypeScript type check
        working-directory: ./platform
        run: npm run type-check

      - name: Lint check
        working-directory: ./platform
        run: npm run lint --if-present

      - name: i18n locale parity check
        working-directory: ./platform
        run: npm run i18n:check

  # Default server build verification
  build:
    name: Build Verification (Server)
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: ./platform
        run: npm ci

      - name: Build application (server mode)
        working-directory: ./platform
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-server
          path: platform/.next/
          retention-days: 7

  # Static export build (validation only)
  build-static:
    name: Build Verification (Static Export)
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: ./platform
        run: npm ci

      - name: Build application (static export)
        working-directory: ./platform
        run: npm run build
        env:
          NODE_ENV: production
          DEPLOYMENT_TARGET: static

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-static
          path: platform/out/
          retention-days: 7

  # Core backend tests
  backend-tests:
    name: Backend Tests (Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ./backend
        run: python -m pytest tests -q

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        working-directory: ./platform
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './platform'
          severity: 'HIGH,CRITICAL'

  # Performance testing
  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: Install dependencies
        working-directory: ./platform
        run: npm ci

      - name: Build application (server mode)
        working-directory: ./platform
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start Next.js server
        working-directory: ./platform
        run: npm run start &
        env:
          CI: true

      - name: Wait for server
        run: npx -y wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/ai-music-detection
            http://localhost:3000/data-manipulation
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Deploy to production (server-mode via Netlify CLI)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-check, build, build-static, backend-tests, security]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Deploy to Netlify (server-mode build + deploy)
        working-directory: ./platform
        run: npx netlify-cli deploy --build --prod --message="Deploy from GitHub Actions (${{ github.sha }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NODE_ENV: production
        timeout-minutes: 15
