# CrownCode - Auto Labeler Configuration (Current Structure)

platform:
  - "platform/**"

backend:
  - "hf-crowncode-backend/**"

android:
  - "Android-App-CrownCode/**"

docs:
  - "docs/**"
  - "*.md"

github-actions:
  - ".github/workflows/**"
  - ".github/actions/**"

github-config:
  - ".github/**"

ci:
  - ".github/workflows/ci.yml"
  - ".github/workflows/engineering-standards.yml"

types:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/tsconfig.json"
  - "**/tsconfig.*.json"

python:
  - "**/*.py"
  - "**/requirements.txt"
  - "**/pyproject.toml"

styles:
  - "**/*.css"
  - "**/styles/**"

tests:
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/tests/**"
  - "**/__tests__/**"

api:
  - "platform/pages/api/**"
  - "hf-crowncode-backend/app/routes/**"

ai-music-detection:
  - "platform/pages/ai-music-detection/**"
  - "platform/hooks/useYouTubeAnalysis.ts"
  - "platform/hooks/useFileAnalysis.ts"
  - "platform/hooks/analysisGateway.ts"
  - "platform/styles/pages/ai-detection.module.css"

data-manipulation:
  - "platform/pages/data-manipulation/**"
  - "platform/components/MLToolkit/**"
  - "platform/styles/pages/data-manipulation*.css"

crown-fortune:
  - "platform/pages/crown-fortune/**"
  - "platform/components/CrownFortune/**"
  - "platform/data/destiny.ts"
  - "platform/styles/pages/crown-fortune.module.css"

crown-commend:
  - "platform/pages/crown-commend/**"
  - "platform/components/CrownCommend/**"
  - "platform/hooks/useCommend.ts"
  - "platform/styles/pages/crown-commend.module.css"

crown-dreams:
  - "platform/pages/crown-dreams/**"
  - "platform/components/CrownDreams/**"
  - "platform/data/dreams.ts"
  - "platform/styles/pages/crown-dreams.module.css"

crown-vote:
  - "platform/pages/crown-vote/**"
  - "platform/components/CrownVote/**"
  - "platform/styles/pages/crown-vote.module.css"

i18n:
  - "platform/locales/**"
  - "platform/context/LanguageContext.tsx"

layout-navigation:
  - "platform/components/Layout/**"
  - "platform/components/Navigation/**"
  - "platform/components/Home/ProjectsSection.tsx"

search:
  - "platform/pages/search.tsx"
  - "platform/components/Search/**"
  - "platform/hooks/useSearch.ts"
